name: ClassWallet
description: >-
  ClassWallet is a patented digital wallet and public-funds disbursement platform
  used by government agencies, school districts, and program administrators to
  distribute, control, and reconcile public money. Recipients access and spend
  allocated funds online or in-store while administrators get spending controls,
  approved marketplaces, reimbursement workflows, direct vendor payments
  (DirectPay), and audit-ready reporting and compliance. ClassWallet powers K-12
  education programs, Education Savings Accounts (ESAs), scholarships and grants,
  government assistance, and vocational rehabilitation initiatives. It was surfaced
  as a Techstars portfolio company and added to the API Evangelist network; the
  company publishes product and program surfaces but no public developer API or
  developer portal at this time.
